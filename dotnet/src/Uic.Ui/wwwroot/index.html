<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>UIC 工业连接底座</title>

    <script type="text/javascript" src="./require.js"></script>
    <script type="module" src="./uno-bootstrap.js"></script>
    $(ADDITIONAL_CSS)
    $(ADDITIONAL_HEAD)

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #f2f5f9;
            font-family: "Segoe UI", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        #uno-body {
            height: 100%;
        }

        /*
         * 启动层必须挂在 #uno-body 里并带 class="uno-loader"：
         * 引导脚本要在这个节点上驱动 <progress>，并在应用挂载后把它移除。
         * 换掉的是外观，不是结构。
         */
        .uno-loader {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            background: #f2f5f9;
            z-index: 9999;
        }

        .uno-loader .mark {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #1b2029;
        }

        .uno-loader .hint {
            font-size: 12.5px;
            color: #8a94a3;
        }

        .uno-loader progress {
            width: 180px;
            height: 3px;
            border: none;
            border-radius: 2px;
            background: #dfe5ec;
            appearance: none;
            -webkit-appearance: none;
        }

        .uno-loader progress::-webkit-progress-bar {
            background: #dfe5ec;
            border-radius: 2px;
        }

        .uno-loader progress::-webkit-progress-value {
            background: #1d5fa8;
            border-radius: 2px;
            transition: width .2s linear;
        }

        .uno-loader progress::-moz-progress-bar {
            background: #1d5fa8;
            border-radius: 2px;
        }

        .uno-loader img.logo {
            display: none;
        }

        .uno-loader .alert {
            font-size: 12px;
            color: #c0392b;
            max-width: 520px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div id="uno-body">
        <div class="uno-loader" loading-position="bottom" loading-alert="none">
            <div class="mark">UIC</div>
            <progress></progress>
            <div class="hint">正在加载控制台…</div>
            <span class="alert"></span>
        </div>
    </div>

    <noscript>
        <p style="padding:24px;color:#c0392b">控制台需要启用 JavaScript 与 WebAssembly。</p>
    </noscript>
</body>

</html>
